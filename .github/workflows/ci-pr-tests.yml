name: PR Test Suite

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate temporary RSA keys for tests
        run: |
          mkdir -p src/main/resources/certs
          openssl genrsa -out src/main/resources/certs/private_key.pem 2048
          openssl rsa -in src/main/resources/certs/private_key.pem -pubout -out src/main/resources/certs/public_key.pem

      - name: Run Tests
        run: ./mvnw test
